name: CI

# Runs static analysis and the test suite on every push and pull request,
# so a broken build/failing test is caught before it reaches main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create placeholder .env
        # .env is intentionally gitignored (it holds the real API key), but
        # pubspec.yaml declares it as a bundled asset, so `flutter pub get`
        # / `flutter analyze` fail on a fresh checkout without it. The
        # tests never read real .env values (they use a fake repository),
        # so placeholder text is enough to satisfy the asset declaration.
        run: |
          echo "API_URL=https://newsapi.org/v2" >> .env
          echo "API_KEY=placeholder_key_for_ci" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          if-no-files-found: ignore